name: DevContainer dependency auto-update

# .devcontainer/Dockerfile / mcp-servers.json / docker-compose*.yml で pin している依存を
# 7 日クールダウンを満たす最新安定版へ更新し、イメージのビルド検証結果を添えて PR を作成する。
# 解決ロジックは .github/scripts/devcontainer-version-bump.py を参照。

on:
  schedule:
    # 毎週月曜 09:00 JST (= 00:00 UTC) に実行
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-version-auto-update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/devcontainer-auto-update
    steps:
      # Actions はタグ書き換え（2026-03 の trivy-action 侵害等）対策としてコミット SHA で pin する
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # PR 作成のため fetch-depth 0 で履歴を取得
          fetch-depth: 0

      - name: Resolve cooldown-eligible versions and update pins
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/devcontainer-version-bump.py --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # 更新後の pin（SHA256 / 署名 / digest / APT バージョン）が実際に解決できるかを amd64 で検証する。
      # arm64 の SHA256 は公式 checksums との照合のみ（ビルド検証なし）。
      - name: Verify DevContainer image builds
        id: build
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          docker build \
            --build-arg ENABLE_JAVA=true \
            --build-arg TZ=Asia/Tokyo \
            -t devcontainer-bump-check \
            .devcontainer 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit and push to update branch
        if: steps.bump.outputs.changed == 'true'
        env:
          UPDATED: ${{ steps.bump.outputs.updated }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .devcontainer README.md docker-compose.yml docker-compose-without-litellm.yml
          git commit -m "chore(devcontainer): auto-update pinned dependencies" -m "Updated: ${UPDATED}"
          git push --force-with-lease origin "$BRANCH"

      - name: Create or update pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          BODY="$RUNNER_TEMP/body.md"
          cp "$RUNNER_TEMP/summary.md" "$BODY"
          {
            echo
            echo "### ビルド検証 (linux/amd64, ENABLE_JAVA=true)"
            echo
            if [ "$BUILD_OUTCOME" = "success" ]; then
              echo "✅ \`docker build\` 成功"
            else
              echo "❌ \`docker build\` 失敗 — Draft PR として作成。ログ末尾:"
              echo
              echo '```'
              tail -n 40 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "(log unavailable)"
              echo '```'
            fi
            echo
            echo "## レビュー観点"
            echo
            echo "- [ ] 各依存のリリースノート / CHANGELOG に破壊的変更・不審な変更がないか"
            echo "- [ ] ⚠️ 要確認 / ❌ 更新できなかった依存 の内容を確認したか"
            echo "- [ ] DevContainer 再ビルド後に \`/mcp\` で MCP サーバーが起動するか"
            echo "- [ ] arm64 (Apple Silicon) 環境でもビルドできるか"
            echo
            echo "---"
            echo
            echo "🤖 Auto-generated by \`.github/workflows/devcontainer-version-update.yml\`"
          } >> "$BODY"

          TITLE="chore(devcontainer): auto-update pinned dependencies"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$BODY"
          else
            DRAFT=""
            if [ "$BUILD_OUTCOME" != "success" ]; then DRAFT="--draft"; fi
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY" $DRAFT
          fi
