name: DevContainer vulnerability scan

# DevContainer イメージと LiteLLM イメージをビルドして Trivy でスキャンする。
# - 定期実行 / 手動実行: 修正版のある CRITICAL / HIGH と設定ミス（CRITICAL / HIGH）を Issue に記録する。
#   脆弱性は devcontainer-version-update を起動する（設定ミスは依存更新では解消しないため起動しない）
# - PR: DevContainer に修正版のある CRITICAL があるか、Dockerfile に CRITICAL の設定ミスがあれば失敗させる
#   （LiteLLM の脆弱性は上流イメージの更新以外に対処手段がないため、ゲートにはせずレポートのみ）
# Private リポジトリ（GHAS なし）のため Code scanning (SARIF) は使わず、Issue とジョブサマリーで通知する。

on:
  schedule:
    # 毎日 07:00 JST (= 22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'litellm/**'
      - '.github/workflows/devcontainer-vuln-scan.yml'
      - '.github/actions/trivy-scan/**'
      - '.github/scripts/devcontainer-vuln-report.py'

permissions:
  contents: read

concurrency:
  group: devcontainer-vuln-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LABEL: devcontainer-vulnerability

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      # Actions はタグ書き換え（2026-03 の trivy-action 侵害等）対策としてコミット SHA で pin する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # キャッシュを使わず毎回ビルドし、ビルド時に取得する APT / npm / pip の最新状態をスキャンする
      - name: Build DevContainer image
        run: |
          set -o pipefail
          docker build \
            --build-arg ENABLE_JAVA=true \
            --build-arg TZ=Asia/Tokyo \
            -t devcontainer-scan \
            .devcontainer 2>&1 | tail -n 200

      - name: Trivy scan
        id: scan
        uses: ./.github/actions/trivy-scan
        with:
          image: devcontainer-scan
          output-dir: ${{ runner.temp }}/trivy

      # LiteLLM 側の失敗で DevContainer の結果記録まで止めないよう continue-on-error にする
      - name: Build LiteLLM image
        id: build_litellm
        continue-on-error: true
        run: |
          set -o pipefail
          docker build -t litellm-scan litellm 2>&1 | tail -n 50

      - name: Trivy scan (LiteLLM)
        id: scan_litellm
        if: steps.build_litellm.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/trivy-scan
        with:
          image: litellm-scan
          output-dir: ${{ runner.temp }}/trivy-litellm
          title: LiteLLM 脆弱性スキャン結果
          config-dir: litellm
          remedy: litellm

      - name: Job summary
        shell: bash
        env:
          REPORT: ${{ steps.scan.outputs.report }}
          REPORT_LITELLM: ${{ steps.scan_litellm.outputs.report }}
        run: |
          litellm_report() {
            if [ -f "$REPORT_LITELLM" ]; then cat "$REPORT_LITELLM"; else echo "## LiteLLM 脆弱性スキャン結果"; echo; echo "⚠️ ビルドまたはスキャンに失敗しました。ワークフローログを確認してください。"; fi
          }
          { cat "$REPORT"; echo; litellm_report; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: |
            ${{ runner.temp }}/trivy
            ${{ runner.temp }}/trivy-litellm
          retention-days: 30

      - name: Fail on fixable CRITICAL or CRITICAL misconfiguration (PR gate)
        if: github.event_name == 'pull_request'
        env:
          N: ${{ steps.scan.outputs.fixable_critical }}
          MC_DEV: ${{ steps.scan.outputs.misconfig_critical }}
          MC_LITELLM: ${{ steps.scan_litellm.outputs.misconfig_critical }}
        run: |
          STATUS=0
          if [ "$N" != "0" ]; then
            echo "::error::修正版のある CRITICAL 脆弱性が ${N} 件あります。ジョブサマリーの対処方法を確認してください。"
            STATUS=1
          fi
          MC=$(( ${MC_DEV:-0} + ${MC_LITELLM:-0} ))
          if [ "$MC" -ne 0 ]; then
            echo "::error::CRITICAL の設定ミスが ${MC} 件あります。ジョブサマリーの「設定ミス」を確認してください。"
            STATUS=1
          fi
          exit "$STATUS"

      - name: Record to issue and trigger auto-update
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.scan.outputs.report }}
          REPORT_LITELLM: ${{ steps.scan_litellm.outputs.report }}
          FP_DEV: ${{ steps.scan.outputs.fingerprint }}
          FP_LITELLM: ${{ steps.scan_litellm.outputs.fingerprint }}
          MC_DEV: ${{ steps.scan.outputs.misconfig }}
          MC_LITELLM: ${{ steps.scan_litellm.outputs.misconfig }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color B60205 \
            --description "DevContainer 脆弱性スキャン（自動）" 2>/dev/null || true
          NUM=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')

          MISCONFIG=$(( ${MC_DEV:-0} + ${MC_LITELLM:-0} ))
          if [ -z "$FP_DEV" ] && [ -z "$FP_LITELLM" ] && [ "$MISCONFIG" -eq 0 ]; then
            echo "修正版のある CRITICAL / HIGH の脆弱性と設定ミスはありません。"
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "最新のスキャンで修正版のある CRITICAL / HIGH の脆弱性と設定ミスは解消されました（${RUN_URL}）。"
            fi
            exit 0
          fi

          # 2 イメージ分の指紋をまとめて Issue 本文に埋め、次回の比較に使う
          FINGERPRINT="${FP_DEV}:${FP_LITELLM}"
          PREV=""
          if [ -n "$NUM" ]; then
            PREV=$(gh issue view "$NUM" --json body --jq .body | sed -n 's/.*<!-- scan-fingerprint: \([0-9a-f:]*\) -->.*/\1/p')
          fi

          BODY="$RUNNER_TEMP/issue.md"
          {
            echo "<!-- scan-fingerprint: ${FINGERPRINT} -->"
            cat "$REPORT"
            echo
            if [ -f "$REPORT_LITELLM" ]; then cat "$REPORT_LITELLM"; else echo "## LiteLLM 脆弱性スキャン結果"; echo; echo "⚠️ ビルドまたはスキャンに失敗しました（${RUN_URL}）。"; fi
            echo
            echo "---"
            echo
            echo "- 最終スキャン: ${RUN_URL}（JSON は artifact \`trivy-results\`）"
            echo "- 「依存更新」は新版が出ていれば \`devcontainer-version-update\` の PR で取り込まれる（公開から 7 日未満の修正版・上流が最新のままのものは除く）"
            echo "- 「再ビルド」は修正版の公開後に DevContainer を再ビルドすれば解消する"
            echo "- LiteLLM は上流イメージの新リリース（または同一タグの再ビルド）を自動更新 PR で取り込むことで解消する"
            echo "- 「設定ミス」は依存更新では解消しないため、該当ファイルの修正か \`.trivyignore.yaml\` での期限付き受容が必要"
            echo "- 解消されると次回スキャンでこの Issue は自動でクローズされる"
            echo
            echo "🤖 Auto-generated by \`.github/workflows/devcontainer-vuln-scan.yml\`"
          } > "$BODY"

          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file "$BODY"
          else
            URL=$(gh issue create --title "DevContainer のスキャンで対応が必要な項目があります" --label "$LABEL" --body-file "$BODY")
            NUM=${URL##*/}
          fi

          # 設定ミスだけなら依存更新では解消しないため起動しない
          if [ -z "${FP_DEV}${FP_LITELLM}" ]; then
            echo "検出は設定ミスのみのため、自動更新は起動しません（Issue #${NUM}）。"
          # 検出内容が前回から変わった場合（または手動実行時）のみ自動更新を起動し、毎日の重複ビルドを避ける
          elif [ "$FINGERPRINT" != "$PREV" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            gh workflow run devcontainer-version-update.yml --ref "${GITHUB_REF_NAME}" \
              -f trigger="devcontainer-vuln-scan #${NUM}"
            echo "devcontainer-version-update を起動しました（Issue #${NUM}）。"
          else
            echo "検出内容が前回（Issue #${NUM}）と同じため、自動更新の起動を省略しました。"
          fi
