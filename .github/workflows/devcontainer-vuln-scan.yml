name: DevContainer vulnerability scan

# DevContainer イメージをビルドして Trivy でスキャンする。
# - 定期実行 / 手動実行: 修正版のある CRITICAL / HIGH を Issue に記録し、devcontainer-version-update を起動する
# - PR: 修正版のある CRITICAL があれば失敗させる
# Private リポジトリ（GHAS なし）のため Code scanning (SARIF) は使わず、Issue とジョブサマリーで通知する。

on:
  schedule:
    # 毎日 07:00 JST (= 22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-vuln-scan.yml'
      - '.github/actions/trivy-scan/**'
      - '.github/scripts/devcontainer-vuln-report.py'

permissions:
  contents: read

concurrency:
  group: devcontainer-vuln-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LABEL: devcontainer-vulnerability

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      # Actions はタグ書き換え（2026-03 の trivy-action 侵害等）対策としてコミット SHA で pin する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # キャッシュを使わず毎回ビルドし、ビルド時に取得する APT / npm / pip の最新状態をスキャンする
      - name: Build DevContainer image
        run: |
          set -o pipefail
          docker build \
            --build-arg ENABLE_JAVA=true \
            --build-arg TZ=Asia/Tokyo \
            -t devcontainer-scan \
            .devcontainer 2>&1 | tail -n 200

      - name: Trivy scan
        id: scan
        uses: ./.github/actions/trivy-scan
        with:
          image: devcontainer-scan
          output-dir: ${{ runner.temp }}/trivy

      - name: Job summary
        env:
          REPORT: ${{ steps.scan.outputs.report }}
        run: cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: ${{ runner.temp }}/trivy
          retention-days: 30

      - name: Fail on fixable CRITICAL (PR gate)
        if: github.event_name == 'pull_request' && steps.scan.outputs.fixable_critical != '0'
        env:
          N: ${{ steps.scan.outputs.fixable_critical }}
        run: |
          echo "::error::修正版のある CRITICAL 脆弱性が ${N} 件あります。ジョブサマリーの対処方法を確認してください。"
          exit 1

      - name: Record to issue and trigger auto-update
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.scan.outputs.report }}
          FINGERPRINT: ${{ steps.scan.outputs.fingerprint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color B60205 \
            --description "DevContainer 脆弱性スキャン（自動）" 2>/dev/null || true
          NUM=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -z "$FINGERPRINT" ]; then
            echo "修正版のある CRITICAL / HIGH はありません。"
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "最新のスキャンで修正版のある CRITICAL / HIGH は解消されました（${RUN_URL}）。"
            fi
            exit 0
          fi

          PREV=""
          if [ -n "$NUM" ]; then
            PREV=$(gh issue view "$NUM" --json body --jq .body | sed -n 's/.*<!-- vuln-fingerprint: \([0-9a-f]*\) -->.*/\1/p')
          fi

          BODY="$RUNNER_TEMP/issue.md"
          {
            cat "$REPORT"
            echo
            echo "---"
            echo
            echo "- 最終スキャン: ${RUN_URL}（JSON は artifact \`trivy-results\`）"
            echo "- 「自動更新」の依存は \`devcontainer-version-update\` の PR で更新される（公開から 7 日未満の修正版は除く）"
            echo "- 「再ビルド」は修正版の公開後に DevContainer を再ビルドすれば解消する"
            echo "- 解消されると次回スキャンでこの Issue は自動でクローズされる"
            echo
            echo "🤖 Auto-generated by \`.github/workflows/devcontainer-vuln-scan.yml\`"
          } > "$BODY"

          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file "$BODY"
          else
            URL=$(gh issue create --title "DevContainer に修正版のある脆弱性があります" --label "$LABEL" --body-file "$BODY")
            NUM=${URL##*/}
          fi

          # 検出内容が前回から変わった場合（または手動実行時）のみ自動更新を起動し、毎日の重複ビルドを避ける
          if [ "$FINGERPRINT" != "$PREV" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            gh workflow run devcontainer-version-update.yml --ref "${GITHUB_REF_NAME}" \
              -f trigger="devcontainer-vuln-scan #${NUM}"
            echo "devcontainer-version-update を起動しました（Issue #${NUM}）。"
          else
            echo "検出内容が前回（Issue #${NUM}）と同じため、自動更新の起動を省略しました。"
          fi
